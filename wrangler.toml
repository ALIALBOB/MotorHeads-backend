name = "motorheads-backend"
main = "src/index.js"
compatibility_date = "2026-06-08"

[vars]
CORS_ORIGIN = "*"
ALLOW_UNVERIFIED_WRITES = "false"
MOTORHEADS_DEPLOY_BLOCK = "25261729"
INDEXER_CONFIRMATIONS = "6"
INDEXER_MAX_BLOCK_RANGE = "1000"
INDEXER_MAX_LOGS_PER_RUN = "50"
GAS_LOW_GWEI = "15"
GAS_MEDIUM_GWEI = "45"
GAS_HIGH_GWEI = "90"
EMERGENCY_READ_ONLY = "false"
INDEXER_ENABLED = "true"
SAFETY_MAX_INDEXER_RUNS_PER_DAY = "320"
SAFETY_MAX_RPC_CALLS_PER_DAY = "5000"
SAFETY_MAX_REGISTRY_WRITES_PER_DAY = "1000"
CUSTOMIZATION_READS_ENABLED = "false"
CUSTOMIZATION_WRITES_ENABLED = "false"
CUSTOMIZATION_AUTH_ENABLED = "true"
CUSTOMIZATION_ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,https://motorheadsonline.com,https://www.motorheadsonline.com"
CUSTOMIZATION_SIWE_DOMAIN = "motorheadsonline.com"
CUSTOMIZATION_SIWE_URI = "https://motorheadsonline.com"
CUSTOMIZATION_CHAIN_ID = "1"
CUSTOMIZATION_SUPPORTED_CONTRACT = "0x0a5008550fc1402bb567a3ba38d9433e6199ceb1"
CUSTOMIZATION_COOKIE_SECURE = "true"
CUSTOMIZATION_NONCE_TTL_SECONDS = "600"
CUSTOMIZATION_SESSION_TTL_SECONDS = "86400"
CUSTOMIZATION_SESSION_TOUCH_SECONDS = "300"
CUSTOMIZATION_NONCE_RATE_LIMIT = "20"
CUSTOMIZATION_NONCE_RATE_WINDOW_SECONDS = "900"
CUSTOMIZATION_VERIFY_RATE_LIMIT = "10"
CUSTOMIZATION_VERIFY_RATE_WINDOW_SECONDS = "900"
CUSTOMIZATION_WRITE_RATE_LIMIT = "30"
CUSTOMIZATION_WRITE_RATE_WINDOW_SECONDS = "3600"
CUSTOMIZATION_NONCE_RETENTION_SECONDS = "604800"
CUSTOMIZATION_SESSION_RETENTION_SECONDS = "2592000"
CUSTOMIZATION_RATE_LIMIT_RETENTION_SECONDS = "172800"
CUSTOMIZATION_CLEANUP_MAX_ROWS = "500"
HOLDER_PLACEMENT_BASE_URL = ""

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "motorheads_registry"
database_id = "c34beb92-48c2-46ff-b01c-41b92b16a633"
migrations_dir = "migrations"
